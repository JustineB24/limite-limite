name: CI
on:
    push:
        branches:
            - develop
            - prod
    pull_request:
        branches:
            - develop
            - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Récupérer le chemin du cache composer
          id: composer-cache
          run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

        - name: Configuration PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: "8.2"
              extensions: curl, mbstring, xml, zip, pdo, pdo_mysql, xdebug
              coverage: xdebug
              tools: composer:v2

        - name: Installer des dépendances
          run: composer install --no-progress --prefer-dist --no-interaction
        
        - name: Mise en cache
          uses: actions/cache@v6
          with:
              path: ${{ steps.composer-cache.outputs.dir }}
              key: ${{ runner.os}}-composer-${{ hashFiles('**/composer.lock') }}
              restore-keys: ${{ runner.os}}-composer-
        
        - name: Auditer les dépendances
          run: composer audit

        - name: Vérification qualité du code
          run: ./vendor/bin/phpcs --standard=PSR12 src tests

        - name: Execution des tests PHPUnit
          run: ./vendor/bin/phpunit --coverage-clover coverage/clover.xml

        - name: Vérification du style avec PHP CS Fixer
          run: ./vendor/bin/php-cs-fixer fix --dry-run --diff